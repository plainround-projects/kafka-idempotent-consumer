<text class="sub" x="636" y="198" text-anchor="middle">expected_totals.json</text>
<text class="sub" x="636" y="220" text-anchor="middle">from the events alone</text>
<rect class="svc" x="880" y="132" width="272" height="96" rx="12"/>
<text class="name" x="896" y="164">Checker</text>
<text class="sub" x="896" y="188">balances against</text>
