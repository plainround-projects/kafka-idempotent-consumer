<text class="name" x="88" y="480">payments-dlq</text>
<text class="sub" x="88" y="504">1 partition, 30 days</text>
<rect class="svc" x="72" y="552" width="304" height="84" rx="12"/>
<text class="name" x="88" y="584">Group coordinator</text>
<text class="sub" x="88" y="608">a broker: offsets, heartbeats</text>
<rect class="svc" x="504" y="308" width="264" height="332" rx="12"/>
<text class="name" x="520" y="340">Balance updater</text>
<text class="sub" x="520" y="364">group balance-updater</text>
<text class="sub" x="520" y="386">validates each payment</text>
<text class="sub" x="520" y="408">one DB transaction each</text>
<text class="sub" x="520" y="430">commits offset after it</text>
<text class="sub" x="520" y="452">bad record to the DLQ</text>
<rect class="boundary" x="880" y="252" width="272" height="388" rx="14"/>
<text class="tag" x="896" y="280">PostgreSQL</text>
<path class="store" d="M904 328a112 12 0 0 1 224 0v102a112 12 0 0 1 -224 0z"/>
<path class="rim" d="M904 328a112 12 0 0 0 224 0"/>
<text class="name" x="1016" y="360" text-anchor="middle">balances</text>
<text class="sub" x="1016" y="382" text-anchor="middle">total numeric(14,2)</text>
<text class="sub" x="1016" y="404" text-anchor="middle">one row per account</text>
<path class="store" d="M904 502a112 12 0 0 1 224 0v102a112 12 0 0 1 -224 0z"/>
<path class="rim" d="M904 502a112 12 0 0 0 224 0"/>
<text class="name" x="1016" y="534" text-anchor="middle">Processed events</text>
